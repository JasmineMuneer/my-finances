<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password — My Finances</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.0.3/src/regular/style.css" />
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.0.3/src/fill/style.css" />
    <style>
        body { background: linear-gradient(135deg, #f8f4ff 0%, #fce4ec 50%, #e3f2fd 100%); min-height: 100vh; }
        .card { background: white; border-radius: 20px; box-shadow: 0 8px 40px rgba(205,180,219,0.18); border: 1px solid rgba(205,180,219,0.25); }
        input:focus { outline: none; border-color: #CDB4DB; box-shadow: 0 0 0 3px rgba(205,180,219,0.15); }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">
    <div class="w-full max-w-md">
        <!-- Logo -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center gap-3 mb-3">
                <div class="w-10 h-10 rounded-2xl flex items-center justify-center" style="background: linear-gradient(135deg, #CDB4DB, #FFAFCC);">
                    <i class="ph-fill ph-currency-circle-dollar text-white text-xl"></i>
                </div>
                <span class="text-2xl font-bold" style="color: #9B72AF;">My Finances</span>
            </div>
            <h1 class="text-xl font-bold text-gray-800 mt-2">Forgot your password?</h1>
            <p class="text-sm text-gray-400 mt-1">Enter your email and we'll send you a reset link.</p>
        </div>

        <!-- Flash message -->
        {% if msg %}
        <div class="mb-5 p-4 rounded-xl text-sm font-medium
            {% if msg_type == 'success' %}bg-green-50 text-green-700 border border-green-200
            {% elif msg_type == 'warning' %}bg-amber-50 text-amber-700 border border-amber-200 break-all
            {% else %}bg-blue-50 text-blue-700 border border-blue-200{% endif %}">
            {{ msg }}
        </div>
        {% endif %}

        <div class="card p-8">
            <form method="POST" action="{{ url_for('forgot_password') }}" class="space-y-5">
                <div>
                    <label class="block text-sm font-semibold text-gray-600 mb-1.5">Email Address</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-[#CDB4DB]">
                            <i class="ph ph-envelope"></i>
                        </div>
                        <input type="email" name="email" required placeholder="you@example.com"
                               class="block w-full pl-10 pr-3 py-3 bg-[#FDFCFF] border border-[#CDB4DB]/40 rounded-xl text-sm text-gray-800 transition">
                    </div>
                </div>

                <button type="submit"
                        class="w-full py-3 rounded-xl font-semibold text-white text-sm transition hover:opacity-90"
                        style="background: linear-gradient(90deg, #FFAFCC, #CDB4DB);">
                    Send Reset Link
                </button>
            </form>
        </div>

        <p class="text-center text-sm text-gray-400 mt-6">
            Remembered it?
            <a href="{{ url_for('login') }}" class="font-semibold hover:underline" style="color: #9B72AF;">Back to Login</a>
        </p>
    </div>
</body>
</html>
